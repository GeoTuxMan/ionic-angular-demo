<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>FAQ</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- multiple: mai multe raspunsuri pot fi deschise deodata; un click pe intrebare deschide/inchide -->
  <ion-accordion-group [multiple]="true" expand="inset">
    @for (item of items; track item.id) {
    <ion-accordion [value]="item.id">
      <ion-item slot="header">
        <ion-label class="ion-text-wrap">{{ item.question }}</ion-label>
      </ion-item>
      <div class="ion-padding answer" slot="content">{{ item.answer }}</div>
    </ion-accordion>
    }
  </ion-accordion-group>
</ion-content>
